name: Weekly site update
 
on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:            # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
  pull-requests: write
 
env:
  SITE_FILE: "index.html"
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
 
      - name: Scrape events and articles
        run: python3 fetch_events_v2.py --articles --max-per-source 8
 
      - name: Choose which scraped events are good enough
        run: python3 apply_scraped.py --site "$SITE_FILE" --events events.json --out updates.json
 
      - name: Apply to site
        run: python3 update_site.py --site "$SITE_FILE" --updates updates.json
        continue-on-error: true   # "nothing to write" is fine
 
      - name: Hide past events, bring back annual ones
        run: python3 expire_events.py --site "$SITE_FILE"
 
      - name: Choose the featured event
        run: python3 build_featured.py --site "$SITE_FILE" --out featured.json
 
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: weekly-update
          delete-branch: true
          title: "Weekly update"
          body: "New scraped events added, past events hidden, featured event refreshed. Merge to publish. Close to skip."
          commit-message: "Weekly events update"
          add-paths: |
            ${{ env.SITE_FILE }}
            articles.json
            featured.json
            featured_image.jpg
 
